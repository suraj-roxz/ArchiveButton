<!DOCTYPE html>
<html>
<head>
    <title>Archive Button Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #172033;
        }

        header {
            background: #172554;
            color: white;
            padding: 22px 40px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 750px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #0001;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 18px 0;
            border: 1px solid #ccd3df;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin: 5px 5px 5px 0;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }

        #fileList {
            margin-top: 20px;
            line-height: 2;
        }

        footer {
            text-align: center;
            color: #64748b;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>☁ Archive Button</header>

<div class="container">
    <div class="card">

        <h1>Cloud Archive Dashboard</h1>

        <p>Manage your files using AWS Cloud Storage.</p>

        <label>Enter file name</label>

        <input
            type="text"
            id="fileName"
            placeholder="Example: button.txt.txt"
        >

        <button onclick="archiveFile()">
            Archive File
        </button>

        <button onclick="viewFiles()">
            View Archived Files
        </button>

        <p id="message"></p>

        <h3>Archived Files</h3>

        <ul id="fileList">
            <li>Click View Archived Files</li>
        </ul>

    </div>

    <footer>
        Powered by AWS S3, Lambda and API Gateway
    </footer>
</div>

<script>

// REPLACE WITH YOUR ACTUAL API GATEWAY URL
const API_URL = "https://5svwcd1a5f.execute-api.us-east-1.amazonaws.com";

async function archiveFile() {

    const fileName =
        document.getElementById("fileName").value.trim();

    const message =
        document.getElementById("message");

    if (!fileName) {
        message.innerText = "Please enter a file name.";
        return;
    }

    message.innerText = "Archiving file...";

    try {
        const response = await fetch(
            API_URL + "/archive",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    file_name: fileName
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.body || "Archive failed");
        }

        message.innerText = "File archived successfully!";

        document.getElementById("fileName").value = "";

        viewFiles();

    } catch (error) {
        message.innerText = "Error: " + error.message;
    }
}

async function viewFiles() {
    const list = document.getElementById("fileList");

    list.innerHTML = "<li>Loading...</li>";

    try {
        const response = await fetch(API_URL + "/files");

        const text = await response.text();

        console.log("HTTP Status:", response.status);
        console.log("Server Response:", text);

        if (!response.ok) {
            throw new Error("HTTP " + response.status + ": " + text);
        }

        const result = JSON.parse(text);

        list.innerHTML = "";

        if (!result.files || result.files.length === 0) {
            list.innerHTML = "<li>No archived files found</li>";
            return;
        }

        result.files.forEach(file => {
            const item = document.createElement("li");
            item.textContent = file;
            list.appendChild(item);
        });

    } catch (error) {
        list.innerHTML = "<li>" + error.message + "</li>";
        console.error(error);
    }
}


</script>

</body>
</html>
